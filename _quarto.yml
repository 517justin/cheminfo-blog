project:
  type: website
  output-dir: _site
  # Only site pages; reports and notes at the root stay out of the build.
  render:
    - index.qmd
    - about.qmd
    - rdkit/index.qmd
    - posts/*/index.qmd

lang: zh-Hant
# Quarto 沒有 zh-Hant 的介面翻譯，會退回簡體；改用台灣繁體用語檔（同書的做法）。
language: _language-zh-TW.yml

website:
  # Repo：517justin/cheminfo-blog（GitHub Pages project site）
  title: "電腦也會化學"
  description: "在網頁上動手玩，看電腦怎麼認識分子。給所有人的化學資訊學入門。"
  image: images/site-card.png
  site-url: https://517justin.github.io/cheminfo-blog/
  repo-url: https://github.com/517justin/cheminfo-blog
  open-graph: true
  twitter-card: true
  page-navigation: true
  navbar:
    left:
      - href: rdkit/index.qmd
        text: 用 RDKit 玩化學
    right:
      - about.qmd
      - icon: github
        href: https://github.com/517justin/cheminfo-blog
        aria-label: GitHub
